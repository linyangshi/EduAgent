<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - EduAgent管理后台</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.svg') }}" type="image/svg+xml">
    <style>
        .admin-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 12px;
        }
    </style>
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <span class="admin-badge">🛡️ 管理后台</span>
                <h1>🎓 EduAgent智教创想</h1>
                <p>管理员登录</p>
            </div>
            
            <form id="adminLoginForm" class="auth-form">
                <div class="error-message global" id="login-global-error" style="display: none; color: #d93025; margin-bottom: 12px;"></div>
                
                <div class="form-group">
                    <label for="username">管理员用户名</label>
                    <input type="text" id="username" name="username" required placeholder="请输入管理员用户名" autocomplete="username">
                    <div class="error-message" id="username-error"></div>
                </div>
                
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" required placeholder="请输入密码" autocomplete="current-password">
                    <div class="error-message" id="password-error"></div>
                </div>
                
                <button type="submit" class="auth-button" id="loginBtn">
                    <span class="button-text">登录</span>
                    <span class="button-loading" style="display: none;">登录中...</span>
                </button>
                
                <div class="auth-links">
                    <a href="/" class="auth-link">← 返回主页</a>
                </div>
            </form>
        </div>
        
        <div class="auth-footer">
            <p>&copy; 2025 EduAgent智教创想 管理后台. 保留所有权利.</p>
        </div>
    </div>
    
    <script>
        const form = document.getElementById('adminLoginForm');
        const loginBtn = document.getElementById('loginBtn');
        const buttonText = loginBtn.querySelector('.button-text');
        const buttonLoading = loginBtn.querySelector('.button-loading');
        const globalError = document.getElementById('login-global-error');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // 清除错误消息
            globalError.style.display = 'none';
            
            // 显示加载状态
            loginBtn.disabled = true;
            buttonText.style.display = 'none';
            buttonLoading.style.display = 'inline';
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const result = await response.json();
                
                if (response.ok && result.success) {
                    // 保存token
                    localStorage.setItem('admin_token', result.token);
                    localStorage.setItem('admin_info', JSON.stringify(result.admin));
                    
                    // 跳转到管理后台
                    window.location.href = '/admin/dashboard';
                } else {
                    globalError.textContent = result.error || '登录失败，请重试';
                    globalError.style.display = 'block';
                }
            } catch (error) {
                globalError.textContent = '网络错误，请检查连接';
                globalError.style.display = 'block';
            } finally {
                // 恢复按钮状态
                loginBtn.disabled = false;
                buttonText.style.display = 'inline';
                buttonLoading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
