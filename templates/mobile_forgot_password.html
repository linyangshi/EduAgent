<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>找回密码 - EduAgent 智教创想</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile_login.css', v=2) }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .password-requirements {
            margin-top: 10px;
            font-size: 12px;
            color: #8e99a3;
            padding-left: 5px;
        }
        .requirement {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 4px;
            transition: color 0.3s ease;
        }
        .requirement.met {
            color: #52c41a;
        }
        .requirement i {
            font-size: 10px;
        }
        .send-code-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            z-index: 10;
        }
        .send-code-btn:disabled {
            background: #d1d5db;
            cursor: not-allowed;
        }
        #email {
            padding-right: 95px; /* 为获取验证码按钮留出空间 */
        }
    </style>
</head>
<body>
    <div class="brand-header">
        <div class="logo-container">
            <img src="{{ url_for('static', filename='images/favicon.svg') }}" alt="Logo">
        </div>
        <h1 class="brand-name">找回密码</h1>
        <p class="welcome-msg">验证邮箱以重置您的密码</p>
    </div>

    <div class="login-card">
        <form id="forgotForm">
            <!-- Step 1: Email & Verification Code -->
            <div id="step1">
                <div class="form-group">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="email" name="email" placeholder="注册邮箱" required>
                    <button type="button" class="send-code-btn" id="sendCodeBtn">获取验证码</button>
                </div>

                <div class="form-group" style="margin-top: 15px;">
                    <i class="fas fa-shield-alt input-icon"></i>
                    <input type="text" id="verification_code" name="verification_code" placeholder="输入验证码" required>
                </div>
            </div>

            <!-- Step 2: New Password -->
            <div id="step2" style="margin-top: 15px;">
                <div class="form-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="new_password" name="new_password" placeholder="设置新密码" required>
                </div>

                <div class="password-requirements" id="requirements">
                    <div class="requirement" id="req-length"><i class="fas fa-circle"></i> 至少8个字符</div>
                    <div class="requirement" id="req-upper"><i class="fas fa-circle"></i> 包含大写字母</div>
                    <div class="requirement" id="req-lower"><i class="fas fa-circle"></i> 包含小写字母</div>
                    <div class="requirement" id="req-number"><i class="fas fa-circle"></i> 包含数字</div>
                    <div class="requirement" id="req-special"><i class="fas fa-circle"></i> 包含特殊符号</div>
                </div>

                <div class="form-group" style="margin-top: 15px;">
                    <i class="fas fa-check-double input-icon"></i>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="确认新密码" required>
                </div>
            </div>


            <button type="submit" class="login-btn" id="submitBtn">重 置 密 码</button>
            
            <div id="messageBox" style="font-size: 14px; margin-top: 15px; text-align: center; display: none;"></div>
        </form>
    </div>

    <div class="bottom-tip">
        想起密码了？<a href="/mobile-login" class="register-link">立即登录</a>
    </div>

    <script>
        const sendCodeBtn = document.getElementById('sendCodeBtn');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('new_password');
        const confirmInput = document.getElementById('confirm_password');
        const messageBox = document.getElementById('messageBox');
        const submitBtn = document.getElementById('submitBtn');

        // 发送验证码
        sendCodeBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            if (!email || !email.includes('@')) {
                showMsg('请输入有效的邮箱地址', 'error');
                return;
            }

            sendCodeBtn.disabled = true;
            let countdown = 60;
            const timer = setInterval(() => {
                sendCodeBtn.innerText = `${countdown}s`;
                if (countdown <= 0) {
                    clearInterval(timer);
                    sendCodeBtn.innerText = '获取验证码';
                    sendCodeBtn.disabled = false;
                }
                countdown--;
            }, 1000);

            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const result = await response.json();
                if (result.success) {
                    showMsg('验证码已发送，请检查邮箱', 'success');
                } else {
                    showMsg(result.error || '发送失败', 'error');
                    clearInterval(timer);
                    sendCodeBtn.innerText = '获取验证码';
                    sendCodeBtn.disabled = false;
                }
            } catch (err) {
                showMsg('服务器错误', 'error');
                clearInterval(timer);
                sendCodeBtn.innerText = '获取验证码';
                sendCodeBtn.disabled = false;
            }
        });

        // 实时检测密码强度
        passwordInput.addEventListener('input', () => {
            const val = passwordInput.value;
            const reqs = {
                length: val.length >= 8,
                upper: /[A-Z]/.test(val),
                lower: /[a-z]/.test(val),
                number: /[0-9]/.test(val),
                special: /[^A-Za-z0-9]/.test(val)
            };

            updateReq('req-length', reqs.length);
            updateReq('req-upper', reqs.upper);
            updateReq('req-lower', reqs.lower);
            updateReq('req-number', reqs.number);
            updateReq('req-special', reqs.special);
        });

        function updateReq(id, met) {
            const el = document.getElementById(id);
            if (met) {
                el.classList.add('met');
                el.querySelector('i').className = 'fas fa-check-circle';
            } else {
                el.classList.remove('met');
                el.querySelector('i').className = 'fas fa-circle';
            }
        }

        function showMsg(msg, type) {
            messageBox.innerText = msg;
            messageBox.style.color = type === 'success' ? '#52c41a' : '#ff4d4f';
            messageBox.style.display = 'block';
        }

        // 提交表单
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            

            const val = passwordInput.value;
            const isValid = val.length >= 8 && 
                            /[A-Z]/.test(val) && 
                            /[a-z]/.test(val) && 
                            /[0-9]/.test(val) && 
                            /[^A-Za-z0-9]/.test(val);

            if (!isValid) {
                showMsg('新密码不符合安全要求', 'error');
                return;
            }

            if (val !== confirmInput.value) {
                showMsg('两次输入的密码不一致', 'error');
                return;
            }

            submitBtn.innerText = '处理中...';
            submitBtn.disabled = true;

            const formData = new FormData(e.target);
            const data = {
                email: formData.get('email'),
                verification_code: formData.get('verification_code'),
                new_password: val
            };

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                if (result.success) {
                    showMsg('密码重置成功！3秒后跳转登录', 'success');
                    setTimeout(() => {
                        window.location.href = '/mobile-login';
                    }, 3000);
                } else {
                    showMsg(result.error || '重置失败，请检查验证码', 'error');
                    submitBtn.innerText = '重 置 密 码';
                    submitBtn.disabled = false;
                }
            } catch (err) {
                showMsg('网络错误，请稍后再试', 'error');
                submitBtn.innerText = '重 置 密 码';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
