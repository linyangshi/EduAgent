<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>服务条款 - EduAgent智教创想</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    {% if is_mobile %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile.css') }}">
    {% endif %}
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.svg') }}" type="image/svg+xml">
    <style>
        .terms-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
            margin-bottom: 20px;
        }
        
        .terms-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e9ecef;
        }
        
        .terms-title {
            color: #2c3e50;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .terms-version {
            color: #6c757d;
            font-size: 14px;
            margin-bottom: 5px;
        }
        
        .terms-date {
            color: #6c757d;
            font-size: 14px;
        }
        
        .terms-content {
            line-height: 1.8;
            color: #333;
        }
        
        .terms-section {
            margin-bottom: 30px;
        }
        
        .section-title {
            color: #2c3e50;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 15px;
            padding-left: 10px;
            border-left: 4px solid #3498db;
        }
        
        .section-subtitle {
            color: #34495e;
            font-size: 16px;
            font-weight: 600;
            margin: 20px 0 10px 0;
        }
        
        .terms-list {
            margin: 10px 0;
            padding-left: 20px;
        }
        
        .terms-list li {
            margin-bottom: 8px;
            color: #555;
        }
        
        .highlight {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #28a745;
            margin: 15px 0;
        }
        
        .warning {
            background-color: #fff3cd;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #ffc107;
            margin: 15px 0;
        }
        
        .close-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 2px 10px rgba(52, 152, 219, 0.3);
            transition: all 0.3s ease;
            z-index: 1000;
        }
        
        .close-btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4);
        }
        
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #6c757d;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 2px 10px rgba(108, 117, 125, 0.3);
            transition: all 0.3s ease;
            z-index: 1000;
        }
        
        .back-btn:hover {
            background: #5a6268;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(108, 117, 125, 0.4);
        }
        
        @media (max-width: 768px) {
            .terms-container {
                margin: 10px;
                padding: 15px;
            }
            
            .terms-title {
                font-size: 24px;
            }
            
            .section-title {
                font-size: 18px;
            }
            
            .close-btn, .back-btn {
                position: relative;
                top: auto;
                right: auto;
                left: auto;
                margin: 10px 5px;
                display: inline-block;
            }
        }
    </style>
</head>
<body class="auth-body">
    <button class="close-btn" onclick="closeTerms()">关闭</button>
    <button class="back-btn" onclick="goBack()">返回</button>
    
    <main class="terms-container">
        <header class="terms-header">
            <h1 class="terms-title">服务条款</h1>
        </header>
        <div class="terms-content">
            {% if config.get('SERVICE_TERMS') %}
            <p style="white-space: pre-line">{{ config['SERVICE_TERMS'] }}</p>
            {% else %}
            <p>本服务的运营者尚未公布服务条款。如需了解使用条件，请通过反馈页面联系运营者。</p>
            <p><a href="/feedback">前往反馈页面</a></p>
            {% endif %}
        </div>
    </main>

    <script>
        function closeTerms() {
            // 如果是弹窗模式，关闭弹窗
            if (window.opener) {
                window.close();
            } else {
                // 否则返回上一页
                history.back();
            }
        }
        
        function goBack() {
            history.back();
        }
        
        // 键盘事件处理
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeTerms();
            }
        });
    </script>
</body>
</html>
